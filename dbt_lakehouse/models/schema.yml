version: 2

models:
  - name: silver_vendas
    columns:
      - name: id_venda
        data_tests:
          - unique
          - not_null
      - name: status_pagamento
        data_tests:
          - accepted_values:
              values: ['APROVADO', 'CANCELADO']

  - name: dim_clientes
    columns:
      - name: sk_cliente
        data_tests:
          - unique
          - not_null

  - name: dim_lojas
    columns:
      - name: sk_loja
        data_tests:
          - unique
          - not_null

  - name: dim_produtos
    columns:
      - name: sk_produto
        data_tests:
          - unique
          - not_null

  - name: dim_calendario
    columns:
      - name: id_tempo
        data_tests:
          - unique
          - not_null

  - name: fato_vendas
    columns:
      - name: sk_venda
        data_tests:
          - unique
          - not_null
      - name: sk_cliente
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_clientes')
              field: sk_cliente
      - name: sk_loja
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_lojas')
              field: sk_loja
      - name: sk_produto
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_produtos')
              field: sk_produto
