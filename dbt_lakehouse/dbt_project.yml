name: 'retail_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'retail_lakehouse'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  retail_lakehouse:
    silver:
      +materialized: view
    gold:
      +materialized: external
      +format: parquet
